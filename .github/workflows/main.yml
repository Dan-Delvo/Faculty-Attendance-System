name: Deploy FAS to Laptop Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node & Build Assets
        run: |
          npm install
          npm run build

      - name: Sync to Dockge Stack
        run: |
          # The rsync must include the Dockerfile
          sudo rsync -av --delete --exclude='.git' --exclude='node_modules' --exclude='.env' ./ /opt/stacks/fas/
          
          sudo chown -R 33:33 /opt/stacks/fas/storage /opt/stacks/fas/bootstrap/cache
          sudo chmod -R 775 /opt/stacks/fas/storage /opt/stacks/fas/bootstrap/cache

      - name: Docker Compose Up
        run: |
          cd /opt/stacks/fas
          # --build is critical to find the new Dockerfile
          docker compose up -d --build

      - name: Notify Telegram
        if: always()
        run: |
          STATUS="${{ job.status }}"
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d text="FAS Deployment $STATUS! App live on port 8002."
