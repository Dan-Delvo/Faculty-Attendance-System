name: Main Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, linux]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check secret exists
        run: |
          if [ -z "${{ secrets.PROD_ENV_FILE }}" ]; then
            echo "Missing PROD_ENV_FILE secret"
            exit 1
          fi
          echo "Secret detected"

      - name: Write .env
        run: |
          cat > .env << 'EOF'
          ${{ secrets.PROD_ENV_FILE }}
          EOF

      - name: Deploy with Docker Compose
        run: |
          docker compose up -d --build --remove-orphans

      - name: Run migrations + optimize
        run: |
          docker compose exec -T app php artisan migrate --force --no-interaction
          docker compose exec -T app php artisan optimize:clear
          docker compose exec -T app php artisan config:cache
          docker compose exec -T app php artisan route:cache
          docker compose exec -T app php artisan view:cache
          docker compose exec -T app php artisan queue:restart

      - name: Health check
        run: |
          curl --fail --silent http://127.0.0.1:8002/up > /dev/null
