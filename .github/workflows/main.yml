name: Deploy Faculty Attendance System

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync Files to Server
        run: |
          TARGET="/opt/stacks/fas/"
          sudo mkdir -p $TARGET
          sudo rsync -av --delete --exclude='.git' --exclude='node_modules' ./ $TARGET

      - name: Docker Build and Up
        run: |
          cd /opt/stacks/fas
          # Build the new PHP 8.3 image
          sudo docker compose build --no-cache
          # Start the containers
          sudo docker compose up -d

      - name: Application Post-Deployment
        run: |
          cd /opt/stacks/fas
          # Install dependencies inside the container
          sudo docker exec fas_app composer install --no-dev --optimize-autoloader
          # Run migrations
          sudo docker exec fas_app php artisan migrate --force
          # Clear cache
          sudo docker exec fas_app php artisan config:clear
