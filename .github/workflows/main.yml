name: Main Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, linux]
    timeout-minutes: 30

    defaults:
      run:
        shell: bash
        working-directory: /opt/stacks/fasas

    steps:
      - name: Ensure deploy directory exists
        run: |
          test -d /opt/stacks/fasas

      - name: Checkout to deploy directory
        uses: actions/checkout@v4
        with:
          path: /opt/stacks/fasas

      - name: Check secret exists
        env:
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
        run: |
          if [ -z "$PROD_ENV_FILE" ]; then
            echo "Missing PROD_ENV_FILE secret"
            exit 1
          fi
          echo "Secret detected"

      - name: Write .env
        env:
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
        run: |
          printf "%s" "$PROD_ENV_FILE" > .env

      - name: Deploy with Docker Compose
        run: |
          docker compose -f /opt/stacks/fasas/docker-compose.yml up -d --build --remove-orphans

      - name: Run migrations + optimize
        run: |
          docker compose -f /opt/stacks/fasas/docker-compose.yml exec -T app php artisan migrate --force --no-interaction
          docker compose -f /opt/stacks/fasas/docker-compose.yml exec -T app php artisan optimize:clear
          docker compose -f /opt/stacks/fasas/docker-compose.yml exec -T app php artisan config:cache
          docker compose -f /opt/stacks/fasas/docker-compose.yml exec -T app php artisan route:cache
          docker compose -f /opt/stacks/fasas/docker-compose.yml exec -T app php artisan view:cache
          docker compose -f /opt/stacks/fasas/docker-compose.yml exec -T app php artisan queue:restart

      - name: Health check
        run: |
          curl --fail --silent http://127.0.0.1:8002/up > /dev/null
