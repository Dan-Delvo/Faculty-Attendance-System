name: Main Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, linux]
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate PROD_ENV_FILE secret
        env:
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
        run: |
          if [ -z "$PROD_ENV_FILE" ]; then
            echo "Missing PROD_ENV_FILE secret"
            exit 1
          fi

      - name: Prepare deploy directory
        run: |
          mkdir -p /opt/stacks/fasas

      - name: Sync code to /opt/stacks/fasas
        run: |
          rsync -a --delete \
            --no-perms --no-owner --no-group \
            --omit-dir-times \
            --exclude ".git" \
            ./ /opt/stacks/fasas/

      - name: Write .env
        env:
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
        run: |
          printf "%s" "$PROD_ENV_FILE" > /opt/stacks/fasas/.env

      - name: Deploy containers
        run: |
          docker compose -f /opt/stacks/fasas/compose.yaml up -d --build --remove-orphans

      - name: Laravel post-deploy
        run: |
          docker compose -f /opt/stacks/fasas/compose.yaml exec -T app php artisan migrate --force --no-interaction
          docker compose -f /opt/stacks/fasas/compose.yaml exec -T app php artisan optimize:clear
          docker compose -f /opt/stacks/fasas/compose.yaml exec -T app php artisan config:cache
          docker compose -f /opt/stacks/fasas/compose.yaml exec -T app php artisan route:cache
          docker compose -f /opt/stacks/fasas/compose.yaml exec -T app php artisan view:cache
          docker compose -f /opt/stacks/fasas/compose.yaml exec -T app php artisan queue:restart

      - name: Health check
        run: |
          curl --fail --silent http://127.0.0.1:8002/up > /dev/null
